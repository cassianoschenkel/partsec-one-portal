name: Auto-fill Claude PR description

on:
  pull_request_target:
    types: [opened]

# Separate narrowly scoped token. Claude's own workflow remains read-only.
permissions:
  issues: read
  pull-requests: write

jobs:
  fill-description:
    if: |
      github.actor == 'cassianoschenkel' &&
      github.event.pull_request.user.login == 'cassianoschenkel' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'claude/issue-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: never execute untrusted PR-branch code with write permissions.
      - name: Fill empty PR template from Claude's verified Issue handoff
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            // Allow only the specific branch naming scheme of our Claude Action.
            const match = /^claude\/issue-(\d+)-\d{8}-\d{4}$/.exec(pr.head.ref);
            if (!match) {
              core.notice("Unrecognized Claude branch; not editing PR.");
              return;
            }
            const issue_number = Number(match[1]);

            // Do not overwrite any substantive text written by a human.
            const existing = pr.body || "";
            if (existing.trim()) {
              const hasTemplate = existing.includes("<!--") &&
                (existing.includes("Preencha as seções abaixo") ||
                 existing.includes("O que este PR faz e por quê"));
              if (!hasTemplate) {
                core.notice("PR already has a description; preserving it.");
                return;
              }
              const remaining = existing
                .replace(/<!--[\s\S]*?-->/g, "")
                .replace(/^## (Summary|Scope|Database\/migration impact|Security\/tenant impact|Tests|Validation|Out of scope|Deployment notes)\s*$/gm, "")
                .replace(/^\s*-\s+\[[ xX]\]\s+`[^`]+`\s*$/gm, "")
                .replace(/^\s*(Closes|Fixes|Resolves)\s+#\d+\s*$/gim, "")
                .replace(/^\s*…#\d+\)\s*$/gm, "")
                .trim();
              if (remaining) {
                core.notice("PR template contains non-boilerplate content; preserving it.");
                return;
              }
            }

            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
            if (issue.pull_request || issue.user?.login !== "cassianoschenkel") {
              core.warning("Unexpected source issue; not editing PR.");
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const start = "<!-- PARTSEC_PR_BODY_START -->";
            const end = "<!-- PARTSEC_PR_BODY_END -->";
            const handoff = [...comments].reverse().find(comment =>
              comment.user?.login === "claude[bot]" &&
              comment.body?.includes(start) && comment.body?.includes(end) &&
              comment.body?.includes(pr.head.ref)
            );
            if (!handoff) {
              core.notice("No matching Claude PR-description handoff found; leaving PR unchanged.");
              return;
            }

            const begin = handoff.body.indexOf(start) + start.length;
            const finish = handoff.body.indexOf(end, begin);
            if (finish < begin) {
              core.warning("Invalid handoff delimiters.");
              return;
            }

            let body = handoff.body.slice(begin, finish).trim();
            const headings = [
              "## Summary", "## Scope", "## Database/migration impact",
              "## Security/tenant impact", "## Tests", "## Validation",
              "## Out of scope", "## Deployment notes"
            ];
            if (body.length < 120 || body.length > 25000 ||
                body.includes("<!--") || !headings.every(h => body.includes(h))) {
              core.warning("Handoff is incomplete or has placeholders; leaving PR unchanged.");
              return;
            }

            // Ensure the originating Issue is closed when the PR is merged.
            const closes = new RegExp("(?:^|\\n)(?:Closes|Fixes|Resolves)\\s+#" + issue_number + "\\b", "im");
            if (!closes.test(body)) body += "\n\nCloses #" + issue_number;

            await github.rest.pulls.update({
              owner, repo, pull_number: pr.number, body
            });
            core.notice("Populated PR #" + pr.number + " using Claude's Issue #" + issue_number + " handoff.");
